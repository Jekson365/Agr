<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/web/src/assets/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mtabari App</title>
    <script>
      // Applied before first paint — the app bundle is a deferred module, so waiting for React
      // to mount would flash a white page at dark-mode users on every load. Kept in sync with
      // contexts/theme-context.tsx (same storage key, same fallback to the OS preference).
      (function () {
        try {
          var stored = localStorage.getItem('farm.theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
        } catch (e) {
          /* private mode can throw on localStorage; light is a fine fallback */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
