<!doctype html>
<html lang="ka">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google-site-verification" content="7aF220UbRlbTfz-Hf3Cueh-Mwb3pd6ahqKQ6kYhGYl4" />
    <!-- The logo doubles as the tab icon and the link-preview image. public/favicon.svg is a
         leftover from a starter template (purple, not the brand) and is deliberately unused. -->
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />

    <title>მთაბარი — ფერმის მართვის სისტემა</title>
    <meta
      name="description"
      content="მთაბარი — ფერმის მართვის ქართული სისტემა: მიწა, პირუტყვი, ბაღი, სათბური, მოსავალი და მარაგი ერთ სივრცეში. აწარმოე აღრიცხვა და გაყიდე მოსავალი ონლაინ."
    />

    <!-- Every route serves this same file, so one canonical covers the whole app. It points at
         the root because that is where the marketing page lives and the only page a signed-out
         visitor can read — every other route redirects to /login and has nothing to index. -->
    <link rel="canonical" href="https://mtabari.com.ge/" />

    <!-- Indexing is the default; what is worth saying is the rest. Without max-image-preview a
         result carries a thumbnail at best, and the snippet limits are the ones Discover and the
         AI summaries read before deciding how much of the page they may quote. -->
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="მთაბარი" />
    <meta property="og:locale" content="ka_GE" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta property="og:url" content="https://mtabari.com.ge/" />
    <meta property="og:title" content="მთაბარი — ფერმის მართვის სისტემა" />
    <meta
      property="og:description"
      content="მართე მთელი ფერმა ერთი ადგილიდან — მიწა, პირუტყვი, ბაღი, სათბური, მოსავალი, მარაგი და გაყიდვები."
    />
    <meta property="og:image" content="https://mtabari.com.ge/logo.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="მთაბარი" />

    <!-- "summary" rather than "summary_large_image": the logo is square. A purpose-made 1200x630
         image would earn the wide card. -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="მთაბარი — ფერმის მართვის სისტემა" />
    <meta
      name="twitter:description"
      content="მართე მთელი ფერმა ერთი ადგილიდან — მიწა, პირუტყვი, ბაღი, სათბური, მოსავალი, მარაგი და გაყიდვები."
    />
    <meta name="twitter:image" content="https://mtabari.com.ge/logo.png" />

    <meta name="theme-color" content="#2e7d5b" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#4caf85" media="(prefers-color-scheme: dark)" />

    <script>
      // Applied before first paint — the app bundle is a deferred module, so waiting for React
      // to mount would flash a white page at dark-mode users on every load. Kept in sync with
      // contexts/theme-context.tsx (same storage key, same fallback to the OS preference).
      (function () {
        try {
          var stored = localStorage.getItem('farm.theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
        } catch (e) {
          /* private mode can throw on localStorage; light is a fine fallback */
        }
      })();
    </script>
  </head>
  <body>
    <!-- The marketing page's blocks fade in as they scroll past, which means they start at zero
         opacity and are revealed by an observer. With the page baked in at build time (see
         scripts/prerender.mjs) there is now something to read before that observer exists, so a
         reader without JavaScript is handed it revealed rather than blank. -->
    <noscript>
      <style>
        [data-reveal] {
          opacity: 1;
          transform: none;
        }
      </style>
    </noscript>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
